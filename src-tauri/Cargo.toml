[package]
name = "focus-ledger"
version = "0.1.0"
description = "Local ADHD task tracker with agent-accessible task state"
authors = ["ashle"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.6.1", features = [] }
uuid = { version = "1.11.0", features = ["v4"] }
